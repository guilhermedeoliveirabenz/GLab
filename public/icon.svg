<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Laptop Device -->
  <g transform="translate(96, 120)" filter="url(#shadow)">
    <!-- Screen Outer Frame -->
    <rect x="20" y="20" width="280" height="180" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    <!-- Screen Inner Display -->
    <rect x="32" y="32" width="256" height="156" rx="8" fill="url(#screenGrad)" />
    
    <!-- Code / Dashboard Elements on Display -->
    <!-- Window dots -->
    <circle cx="48" cy="48" r="4" fill="#ef4444" />
    <circle cx="62" cy="48" r="4" fill="#f59e0b" />
    <circle cx="76" cy="48" r="4" fill="#10b981" />

    <!-- Calendar / Grid Graphic -->
    <rect x="52" y="68" width="80" height="56" rx="6" fill="#3b82f6" fill-opacity="0.4" stroke="#60a5fa" stroke-width="2" />
    <line x1="52" y1="84" x2="132" y2="84" stroke="#60a5fa" stroke-width="2" />
    <circle cx="72" cy="100" r="3" fill="#ffffff" />
    <circle cx="92" cy="100" r="3" fill="#ffffff" />
    <circle cx="112" cy="100" r="3" fill="#ffffff" />
    <circle cx="72" cy="112" r="3" fill="#60a5fa" />
    <circle cx="92" cy="112" r="3" fill="#10b981" />
    <circle cx="112" cy="112" r="3" fill="#60a5fa" />

    <!-- Server / Lab Metrics Lines -->
    <rect x="148" y="68" width="120" height="10" rx="5" fill="#38bdf8" />
    <rect x="148" y="86" width="90" height="8" rx="4" fill="#94a3b8" />
    <rect x="148" y="102" width="105" height="8" rx="4" fill="#94a3b8" />
    <rect x="148" y="118" width="70" height="8" rx="4" fill="#10b981" />

    <!-- Checkmark Badge -->
    <circle cx="250" cy="150" r="16" fill="#10b981" />
    <path d="M243 150 L248 155 L257 145" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Laptop Base -->
    <path d="M0 206 L320 206 C320 218 308 228 292 228 L28 228 C12 228 0 218 0 206 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" />
    <!-- Trackpad notch -->
    <rect x="130" y="206" width="60" height="6" rx="3" fill="#94a3b8" />
  </g>
</svg>
